[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-parser-v2"
version = "0.1.0"
description = "Enterprise Academic Resume Intelligence Engine - Phase 1 Foundation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "FacultyIQ Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "Pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "B", "C4", "SIM", "ARG"]
ignore = []

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
