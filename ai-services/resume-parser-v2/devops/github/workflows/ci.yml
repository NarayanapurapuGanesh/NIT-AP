name: FacultyIQ Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatchling pytest httpx pydantic uvicorn structlog ruff

    - name: Run Ruff Linter
      run: ruff check .

    - name: Verify Python Compilation
      run: python -c "import glob, py_compile; files = glob.glob('**/*.py', recursive=True); [py_compile.compile(f, doraise=True) for f in files]; print(f'Compiled {len(files)} files successfully')"

    - name: Execute Pytest Suite
      run: pytest tests/ --maxfail=1 --disable-warnings
