version: '3.8'

services:
  ai-services-dev:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile.ai-services
    container_name: facultyiq-ai-services-dev
    environment:
      - APP_ENV=development
      - DEBUG=true
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
