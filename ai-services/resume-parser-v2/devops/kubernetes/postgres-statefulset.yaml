apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: facultyiq-prod
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: facultyiq
        - name: POSTGRES_USER
          value: facultyiq_admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: facultyiq-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: facultyiq-prod
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
