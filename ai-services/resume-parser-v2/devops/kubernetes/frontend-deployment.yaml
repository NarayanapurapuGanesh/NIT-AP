apiVersion: apps/v1
kind: Deployment
metadata:
  name: facultyiq-frontend
  namespace: facultyiq-prod
  labels:
    app: facultyiq-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facultyiq-frontend
  template:
    metadata:
      labels:
        app: facultyiq-frontend
    spec:
      containers:
      - name: frontend
        image: facultyiq/frontend:2.0.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: facultyiq-prod
spec:
  type: ClusterIP
  selector:
    app: facultyiq-frontend
  ports:
  - port: 3000
    targetPort: 3000
