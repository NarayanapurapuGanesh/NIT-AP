apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: facultyiq-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: facultyiq-prod
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
  - port: 11434
