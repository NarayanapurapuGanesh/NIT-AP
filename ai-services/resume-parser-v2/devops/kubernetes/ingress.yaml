apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facultyiq-ingress
  namespace: facultyiq-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - facultyiq.nitandhra.ac.in
    secretName: facultyiq-tls-cert
  rules:
  - host: facultyiq.nitandhra.ac.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: ai-services-service
            port:
              number: 8000
